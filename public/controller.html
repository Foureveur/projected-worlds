<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d0820" />
  <title>Manette · Rage Royale</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>%F0%9F%8E%AE</text></svg>" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="stylesheet" href="/css/controller.css" />
</head>
<body>
  <!-- Écran de connexion -->
  <section id="connect" class="screen">
    <h1>RAGE ROYALE</h1>
    <p class="tagline">Ta manette</p>
    <div id="connectStatus">Connexion…</div>
    <div id="codeEntry" class="hidden">
      <p>Entre le code affiché sur l'écran :</p>
      <input id="codeInput" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="XXXX" />
      <button id="codeBtn">Rejoindre</button>
    </div>
  </section>

  <!-- Sélection du personnage -->
  <section id="select" class="screen hidden">
    <h2>Choisis ton combattant</h2>
    <div class="char-grid" id="charGrid"><!-- rempli par controller.js --></div>
    <div class="moves-legend">
      <span>👊 Coup</span><span>🦶 Pied</span><span>⚡ Spécial</span><span>🛡 Garde</span>
      <span class="combo-tip">🛡+👊 Projection</span>
      <span class="combo-tip">◀◀ / ▶▶ Dash</span>
      <span class="combo-tip">Coups enchaînés = Combos</span>
    </div>
    <div class="mode-toggle" id="modeToggle">
      <span class="mt-label">Manette&nbsp;:</span>
      <button class="mode-opt" data-mode="dpad">✚ Croix</button>
      <button class="mode-opt" data-mode="joy">🕹 Joystick</button>
      <button class="mode-opt" data-mode="mix">🎛 Mixte</button>
    </div>
    <div class="select-actions">
      <button id="readyBtn" class="big-btn">PRÊT ! (2 joueurs)</button>
      <button id="soloBtn" class="big-btn solo">🤖 Solo vs CPU</button>
    </div>
  </section>

  <!-- Manette de jeu -->
  <section id="pad" class="screen hidden">
    <div id="hud">
      <div class="hud-name"><span id="hudName">—</span> · <span id="hudForm">—</span></div>
      <div class="bars">
        <div class="bar"><div id="hudHp" class="fill hp"></div></div>
        <div class="bar rage"><div id="hudRage" class="fill rg"></div></div>
      </div>
      <div class="hud-special">⚡ <span id="hudSpecial">—</span></div>
    </div>

    <div id="waiting" class="waiting">En attente de l'autre joueur…</div>

    <div class="controls">
      <!-- Zone de déplacement : croix 3x3 OU joystick selon le mode -->
      <div class="move-zone">
        <div class="dpad9" id="dpad9">
          <button class="dcell diag" data-dirs="up left">↖</button>
          <button class="dcell" data-dirs="up"><span>↑</span><small>SAUT</small></button>
          <button class="dcell diag" data-dirs="up right">↗</button>
          <button class="dcell" data-dirs="left">◀</button>
          <button class="dcell center" data-dirs=""></button>
          <button class="dcell" data-dirs="right">▶</button>
          <button class="dcell diag" data-dirs="down left">↙</button>
          <button class="dcell" data-dirs="down"><span>↓</span><small>BAS</small></button>
          <button class="dcell diag" data-dirs="down right">↘</button>
        </div>
        <div class="joystick" id="joystick">
          <div class="joy-ring"></div>
          <div class="joy-knob" id="joyKnob">🕹</div>
        </div>
        <div class="mixzone" id="mixzone">
          <button class="dcell diag mx mx-ul" data-dirs="up left">↖</button>
          <button class="dcell mx mx-u" data-dirs="up">↑</button>
          <button class="dcell diag mx mx-ur" data-dirs="up right">↗</button>
          <button class="dcell mx mx-l" data-dirs="left">◀</button>
          <button class="dcell mx mx-r" data-dirs="right">▶</button>
          <button class="dcell diag mx mx-dl" data-dirs="down left">↙</button>
          <button class="dcell mx mx-d" data-dirs="down">↓</button>
          <button class="dcell diag mx mx-dr" data-dirs="down right">↘</button>
          <div class="joystick mini" id="joystickMix"><div class="joy-knob" id="joyKnobMix">🕹</div></div>
        </div>
      </div>

      <!-- Boutons d'action (diamant façon PlayStation) + saut -->
      <div class="actions">
        <button class="btn act jump" data-btn="up"><span>▲</span><small>SAUT</small></button>
        <button class="btn act special" data-btn="special"><span>⚡</span><small>SPÉCIAL</small></button>
        <button class="btn act block" data-btn="block"><span>🛡</span><small>GARDE</small></button>
        <button class="btn act kick" data-btn="kick"><span>🦶</span><small>PIED</small></button>
        <button class="btn act punch" data-btn="punch"><span>👊</span><small>COUP</small></button>
      </div>
    </div>
  </section>

  <!-- Invite à tourner l'écran -->
  <div id="rotate" class="rotate hidden">
    <div>🔄<br />Tourne ton iPhone<br />en mode paysage</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script type="module" src="/js/controller/controller.js"></script>
</body>
</html>
