services:
  rage-royale:
    build: .
    image: rage-royale
    container_name: rage-royale
    restart: unless-stopped
    ports:
      # Expose seulement sur la loopback : c'est le reverse proxy (nginx /
      # caddy) qui gère le port public + le HTTPS. Mets "3000:3000" à la
      # place si tu veux exposer directement.
      - "127.0.0.1:3000:3000"
    environment:
      # Domaine public où le jeu sera servi (pour le QR code / les liens).
      # À adapter, ou à passer via un fichier .env.
      - PUBLIC_URL=${PUBLIC_URL:-}
      - PORT=3000
